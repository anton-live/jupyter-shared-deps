[project]
name = "jupyter-shared-deps"
version = "2.1.0"
description = "Shared Jupyter dependencies for notebook execution"
authors = [
    {name = "Anton Golubev", email = "anton.golubev@gmail.com"},
]
requires-python = "<4.0,>=3.12"
dependencies = [
    # Core Jupyter
    "jupyter<2.0.0,>=1.0.0",

    # Data manipulation and visualization
    "pandas<4.0.0,>=3.0.6",
    "numpy>=2.5.2",
    "plotly<6.0.0,>=5.18.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",

    # Google Cloud integration
    "google-cloud-bigquery<4.0.0,>=3.25.0",
    "google-cloud-storage<4.0.0,>=3.0.0",
    "pandas-gbq>=0.26.0",
    "gcsfs>=2025.7.0",
    "fsspec>=2025.7.0",

    # File formats
    "openpyxl<4.0.0,>=3.1.2",
    "pyarrow>=26.0.0",

    # Utilities
    "tqdm>=4.67.0",
    "pytz>=2024.1",  # pandas 3 no longer pulls it in; notebooks use it for time zones
    "jupytext>=1.16.0",
]
readme = "README.md"

