[project]
name = "jupyter-shared-deps"
version = "1.0.0"
description = "Shared Jupyter dependencies for notebook execution"
authors = [
    {name = "Anton Golubev", email = "anton.golubev@gmail.com"},
]
requires-python = "<4.0,>=3.12"
dependencies = [
    # Core Jupyter
    "jupyter<2.0.0,>=1.0.0",

    # Data manipulation and visualization
    "pandas<3.0.0,>=2.2.0",
    "numpy>=1.26.0",
    "plotly<6.0.0,>=5.18.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",

    # Google Cloud integration
    "google-cloud-bigquery<4.0.0,>=3.25.0",
    "google-cloud-storage<3.0.0,>=2.14.0",
    "pandas-gbq>=0.26.0",
    "gcsfs<2025.0.0,>=2023.12.2",
    "fsspec<2025.0.0,>=2023.12.2",

    # File formats
    "openpyxl<4.0.0,>=3.1.2",
    "pyarrow<16.0.0,>=15.0.0",

    # Utilities
    "tqdm>=4.67.0",
    "jupytext>=1.16.0",
]
readme = "README.md"

