name: Build and Publish Package

on:
  push:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
        
      - name: Build package
        run: uv build --no-sources
